name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        nativephp: ['^3.0', '^4.0']

    name: PHP ${{ matrix.php }} - NativePHP ${{ matrix.nativephp }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Install dependencies
        run: composer update --with "nativephp/mobile:${{ matrix.nativephp }}" --no-interaction --prefer-dist

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Check refactoring
        run: vendor/bin/rector process --dry-run

      - name: Run static analysis
        run: vendor/bin/phpstan analyse

      - name: Run tests
        run: vendor/bin/pest --coverage --min=95

  lint-kotlin:
    runs-on: ubuntu-latest
    name: Kotlin Lint
    steps:
      - uses: actions/checkout@v5

      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: Lint Kotlin files
        run: ktlint "resources/android/src/**/*.kt"

  lint-swift:
    runs-on: macos-latest
    name: Swift Lint
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint Swift files
        run: swiftlint lint --strict --config resources/ios/.swiftlint.yml resources/ios/Sources/

  # Single stable check for branch protection to require: it passes only when
  # every job above passed, so the rule never needs editing when the matrix changes.
  tests:
    if: always()
    needs: [php, lint-kotlin, lint-swift]
    runs-on: ubuntu-latest
    name: tests
    steps:
      - name: Require every job to have succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
